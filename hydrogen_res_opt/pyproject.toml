[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogen_res_opt"
version = "0.1.0"
description = "Co-optimization of RES capacity, substation selection and cable sizing for green hydrogen LCOH."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyomo>=6.7",
    "pulp>=2.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hydrogen-res-opt = "hydrogen_res_opt.cli:main"

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*"]
